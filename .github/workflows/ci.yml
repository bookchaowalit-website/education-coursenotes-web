name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared Node CI: npm ci, lint, typecheck, the node:test suite (npm test), next build. Fails closed.
  # No coverage gate: the repo is recommended for archive (L1 only) and its tests use node:test, not Vitest.
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      require-tests: true
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build

  # Shared security scan: gitleaks, Semgrep, OSV-Scanner, Trivy.
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
